<section id="portfolio" class="py-20 bg-dark-bg">
  <div class="max-w-6xl mx-auto px-6">

    <div class="text-center mb-12">
      <p class="hud-label text-accent text-xs uppercase mb-3">
        Portfolio
      </p>
      <h2 class="text-3xl md:text-4xl font-bold text-white">
        My Projects
      </h2>
      <p class="text-gray-400 mt-4">
        Explore some of my recent works.
      </p>
    </div>

    <!-- cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <!-- projek 1 -->
      <button
        type="button"
        data-project="proj-1"
        class="project-card text-left bg-gray-900 pixel-card overflow-hidden border border-gray-800 card-hover transition group"
      >
        <div class="h-52 bg-gray-800 overflow-hidden">
          <img
            src="images/project1-1.png"
            alt="Game Session Manager"
            class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
          >
        </div>
        <div class="p-6">
          <p class="hud-label text-accent text-xs uppercase mb-2">
            Project 01
          </p>
          <h3 class="text-xl font-bold text-white mb-3">
            Game Session Manager
          </h3>
          <p class="text-gray-400 text-sm">
            ▶ Klik untuk deploy smoke
          </p>
        </div>
      </button>

      <!-- projek 2 -->
      <button
        type="button"
        data-project="proj-2"
        class="project-card text-left bg-gray-900 pixel-card overflow-hidden border border-gray-800 card-hover transition group"
      >
        <div class="h-52 bg-gray-800 overflow-hidden">
          <img
            src="images/project2-1.png"
            alt="Project Two"
            class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
          >
        </div>
        <div class="p-6">
          <p class="hud-label text-accent text-xs uppercase mb-2">
            Project 02
          </p>
          <h3 class="text-xl font-bold text-white mb-3">
            LetsMeet
          </h3>
          <p class="text-gray-400 text-sm">
            ▶ Klik untuk deploy smoke
          </p>
        </div>
      </button>

      <!-- projek 3 -->
      <button
        type="button"
        data-project="proj-3"
        class="project-card text-left bg-gray-900 pixel-card overflow-hidden border border-gray-800 card-hover transition group"
      >
        <div class="h-52 bg-gray-800 overflow-hidden">
          <img
            src="images/project3-1.png"
            alt="Project Three"
            class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
          >
        </div>
        <div class="p-6">
          <p class="hud-label text-accent text-xs uppercase mb-2">
            Project 03
          </p>
          <h3 class="text-xl font-bold text-white mb-3">
            mediaVault
          </h3>
          <p class="text-gray-400 text-sm">
            ▶ Klik untuk deploy smoke
          </p>
        </div>
      </button>

    </div>
  </div>
</section>



<div
  id="project-modal"
  class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/30 p-4 opacity-0 transition-opacity duration-500"
  aria-hidden="true"
>
  <div
    class="relative bg-gray-900/85 backdrop-blur-sm border border-gray-700 pixel-card w-full max-w-5xl max-h-[90vh] overflow-y-auto shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >

    <!-- CLOSE BUTTON -->
    <button
      type="button"
      id="modal-close"
      aria-label="Close popup"
      class="sticky top-3 float-right mr-3 mt-3 z-10 w-10 h-10 pixel-card bg-gray-800 text-white hover:bg-red-600 transition text-2xl"
    >
      &times;
    </button>

    <div class="p-6 md:p-8 clear-both">

      <p
        id="modal-category"
        class="hud-label text-accent text-xs uppercase mb-3"
      ></p>

      <h2
        id="modal-title"
        class="text-2xl md:text-3xl font-bold text-white mb-4"
      ></h2>

      <p
        id="modal-desc"
        class="text-gray-300 leading-relaxed mb-8"
      ></p>

      <h3 class="text-white text-lg font-semibold mb-4">
        Project Gallery
      </h3>

      <div
        id="modal-gallery"
        class="grid grid-cols-1 sm:grid-cols-2 gap-4"
      ></div>

    </div>
  </div>
</div>
